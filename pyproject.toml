[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "image-generation-claim-audit"
version = "0.1.0"
description = "Offline audit of documented prompt conditioned picture creation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
image-generation-claim-audit = "image_generation_claim_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["image_generation_claim_audit*"]
